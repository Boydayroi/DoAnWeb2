<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Thêm Xe Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="mb-3">
            <a href="/admin/cars" class="text-decoration-none text-muted">← Quay lại danh sách xe</a>
        </div>
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-dark text-white p-3">
                <h4 class="mb-0 fw-bold">➕ Thêm Xe Ô Tô Mới</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/admin/cars/save}" th:object="${car}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Tên Mẫu Xe</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Ví dụ: VinFast VF8, Toyota Camry..." required/>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Hãng Xe</label>
                        <input type="text" th:field="*{brand}" class="form-control" placeholder="Ví dụ: VinFast, Honda, Toyota..." required/>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Giá Niêm Yết (VND)</label>
                        <input type="number" th:field="*{price}" class="form-control" placeholder="Nhập số tiền (ví dụ: 1090000000)" required/>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Đường Dẫn URL Ảnh Xe</label>
                        <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="Dán link ảnh xe vào đây (https://...)" required/>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Mô Tả Chi Tiết Thông Số Kỹ Thuật</label>
                        <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập thông tin động cơ, nội thất, bảo hành..."></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-bold flex-grow-1">Lưu Dữ Liệu ✓</button>
                        <a href="/admin/cars" class="btn btn-outline-secondary px-3">Hủy Bỏ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
