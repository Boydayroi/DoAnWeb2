<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Đặt Lịch Hẹn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 650px;">
        <div class="mb-3">
            <a href="/" class="text-decoration-none text-muted">← Quay lại trang chủ</a>
        </div>
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-primary text-white p-4 text-center rounded-top-4">
                <h3 class="mb-1 fw-bold">Đăng Ký Đặt Lịch</h3>
                <p class="mb-0 text-white-50">Áp dụng cho dòng xe: <strong th:text="${car.name}"></strong></p>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/booking/save}" th:object="${appointment}" method="post">
                    <input type="hidden" name="carId" th:value="${car.id}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Họ và Tên Khách Hàng</label>
                        <input type="text" th:field="*{customerName}" class="form-control form-control-lg fs-6" placeholder="Nhập tên đầy đủ của bạn" required/>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Số Điện Thoại</label>
                        <input type="tel" th:field="*{phone}" class="form-control form-control-lg fs-6" placeholder="Nhập số điện thoại liên hệ" required/>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Ngày Hẹn Gặp</label>
                            <input type="date" th:field="*{bookingDate}" class="form-control" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary">Khung Giờ</label>
                            <select th:field="*{bookingTime}" class="form-select">
                                <option value="08:00 - 10:00">Buổi sáng (08:00 - 10:00)</option>
                                <option value="10:00 - 12:00">Buổi trưa (10:00 - 12:00)</option>
                                <option value="14:00 - 16:00">Buổi chiều (14:00 - 16:00)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">Lựa Chọn Loại Dịch Vụ</label>
                        <div class="d-flex gap-4 p-2 bg-light rounded border">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{serviceType}" value="LAI_THU" id="radio1" checked>
                                <label class="form-check-label" for="radio1">Đăng ký lái thử xe</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{serviceType}" value="BAO_DUONG" id="radio2">
                                <label class="form-check-label" for="radio2">Bảo dưỡng định kỳ</label>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">Gửi Yêu Cầu Đăng Ký ✓</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
