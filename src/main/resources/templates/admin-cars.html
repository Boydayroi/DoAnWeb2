<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản Lý Xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex">
        <div class="bg-dark text-white p-3 shadow" style="width: 260px; min-height: 100vh;">
            <h4 class="text-center text-primary fw-bold mb-4">AutoSpace Admin</h4>
            <hr class="bg-secondary">
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a href="/admin/appointments" class="nav-link text-white-50 px-3 py-2">📋 Quản Lý Lịch Hẹn</a>
                </li>
                <li class="nav-item">
                    <a href="/admin/cars" class="nav-link text-white bg-primary rounded px-3 py-2 fw-bold shadow-sm">🚗 Quản Lý Danh Mục Xe</a>
                </li>
                <li class="nav-item mt-5">
                    <a href="/" class="nav-link text-warning px-3 py-2">🏠 Quay Lại Trang Chủ</a>
                </li>
            </ul>
        </div>
        
        <div class="p-4 w-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-dark fw-bold mb-0">🚗 Quản Lý Danh Sách Ô Tô</h2>
                <a href="/admin/cars/add" class="btn btn-success fw-bold shadow-sm">+ Thêm Dòng Xe Mới</a>
            </div>
            
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-0">
                    <table class="table table-hover table-striped mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-3" style="width: 120px;">Hình Ảnh</th>
                                <th>Tên Xe</th>
                                <th>Hãng Xe</th>
                                <th class="text-end pe-4">Giá Tham Khảo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="car : ${cars}">
                                <td class="ps-3">
                                    <img th:src="${car.imageUrl}" class="rounded shadow-sm" style="width: 90px; height: 55px; object-fit: cover;">
                                </td>
                                <td class="fw-bold text-primary" th:text="${car.name}"></td>
                                <td th:text="${car.brand}"></td>
                                <td class="text-end fw-bold text-danger pe-4" th:text="${#numbers.formatDecimal(car.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
